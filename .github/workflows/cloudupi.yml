name: CloudUPI Cost Estimator

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  estimate-cost:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}